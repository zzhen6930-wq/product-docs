function focusSlowest(){expanded=true;selectedEvent=current().events.reduce((max,e,i,a)=>e.duration>a[max].duration?i:max,0);stepFilter='all';insTab='detail';render()}
function navigateEvent(delta){const i=selectedEvent+delta;if(i>=0&&i<current().events.length){selectedEvent=i;insTab='detail';render()}}
function inspector(){const t=current(),e=t.events[selectedEvent];return `<aside class="inspector" aria-label="步骤检查器"><div class="ins-head"><div class="ins-kicker"><span>步骤检查器 / 第 ${sess().rounds.indexOf(round)+1} 轮</span><button class="close" aria-label="关闭检查器" onclick="closeInspector()">×</button></div><h3>${e.name}</h3><div class="ins-sub mono">${e.tool}</div><div class="ins-pills"><span class="tag blue">${e.type}</span><span class="tag ${e.status==='error'?'red':'green'}">${e.status==='error'?'调用失败':'调用成功'}</span><span class="muted" style="font-size:10px;margin-left:auto">${e.duration}s ${e.token?'· '+e.token+' Token':''}</span></div></div><div class="ins-nav"><span>步骤 ${selectedEvent+1} / ${t.events.length}</span><button ${selectedEvent===0?'disabled':''} onclick="navigateEvent(-1)">↑ 上一条</button><button ${selectedEvent===t.events.length-1?'disabled':''} onclick="navigateEvent(1)">↓ 下一条</button></div><div class="ins-tabs"><button class="${insTab==='detail'?'on':''}" onclick="insTab='detail';render()">输入 / 输出</button>${e.context?`<button class="${insTab==='context'?'on':''}" onclick="insTab='context';render()">模型上下文</button>`:''}<button class="${insTab==='raw'?'on':''}" onclick="insTab='raw';render()">原始记录</button></div><div class="ins-body">${insTab==='context'?contextPanel(e):insTab==='raw'?rawPanel(e):detailPanel(e)}<div class="ins-section"><div class="ins-label">执行信息</div><div class="kv"><span>事件 ID</span><b>${t.id}_step_${String(selectedEvent+1).padStart(2,'0')}</b><span>相对起止</span><b>+${e.start.toFixed(1)}s → +${(e.start+e.duration).toFixed(1)}s</b><span>执行用户</span><b>${sess().scene==='POPO群聊'?'member1@example.com':sess().user}</b></div></div></div></aside>`}
function detailPanel(e){return `${e.note?`<div class="ins-callout ${e.recovered?'':'red'}"><strong>${e.recovered?'调用失败，整轮已恢复':'任务未完成'}</strong>${e.note}${e.recovered?'<br><button class="link" style="margin-top:8px" onclick="inspect(5)">查看成功的重试 →</button>':''}</div>`:''}${e.retryOf!==undefined?`<div class="ins-callout green"><strong>重试成功</strong>本次调用恢复了第 ${e.retryOf+1} 步的失败请求。<br><button class="link" onclick="inspect(${e.retryOf})">对照原失败请求 →</button></div>`:''}<div class="ins-section"><div class="ins-label">${e.type==='模型调用'?'请求摘要':'输入参数'}<button class="link" onclick="copyEventPart('input')">复制</button></div><pre class="ins-code">${esc(raw(e.input))}</pre></div><div class="ins-section"><div class="ins-label">${e.type==='模型调用'?'输出摘要':'返回结果'}<button class="link" onclick="copyEventPart('output')">复制</button></div><pre class="ins-code">${esc(raw(e.output))}</pre></div>${e.context?'<p class="context-note">排查回答依据可切换「模型上下文」，对照本次请求中的指令、输入与工具结果。</p>':''}`}
function contextPanel(e){return `<p class="context-note">以下为本次模型调用的模拟上下文。按发送顺序展示，可用于核对模型实际获得了什么信息。</p>${e.context.map(([label,content])=>`<div class="context-block ${label.startsWith('工具')?'tool':''}"><strong>${label}</strong><p>${esc(content)}</p></div>`).join('')}<div class="ins-callout"><strong>数据说明</strong>当前为原型示例；真实产品仅展示已采集且有权查看的上下文，不推测模型内部思考。</div>`}
function rawPanel(e){return `<div class="ins-section"><div class="ins-label">事件记录<button class="link" onclick="copyValue(JSON.stringify(current().events[selectedEvent],null,2))">复制</button></div><pre class="ins-code" style="max-height:none">${esc(JSON.stringify(e,null,2))}</pre></div>`}
function copyEventPart(part){copyValue(raw(current().events[selectedEvent][part]))}
async function copyValue(s){try{await navigator.clipboard.writeText(s);notify('已复制')}catch{modal('复制内容',`<p>浏览器不允许直接访问剪贴板，可选中下方内容手动复制。</p><pre class="ins-code">${esc(s)}</pre>`)}}
function copyAnswer(){copyValue($('.answer').innerText.split('DeepSeek Flash')[0])}
function overview(){const ts=sess().rounds.map(i=>traces[i]),es=ts.flatMap(t=>t.events),max=es.reduce((a,b)=>a.duration>b.duration?a:b),dur=ts.reduce((n,t)=>n+t.duration,0);return `<div class="overview"><div class="overview-card"><div class="overview-grid"><div class="metric">累计执行耗时<b>${dur.toFixed(1)}<small> s</small></b><small>不含轮次之间的用户等待时间</small></div><div class="metric">工具请求失败<b>${es.filter(e=>e.status==='error').length}<small> 次</small></b><small>${es.filter(e=>e.recovered).length} 次已通过重试恢复</small></div><div class="metric">任务未完成<b>${ts.filter(t=>t.status==='failed').length}<small> 轮</small></b><small>模型正常回答不等于任务成功</small></div></div></div><div class="overview-card"><h2>需要关注</h2>${sess().rounds.filter(i=>traces[i].events.some(e=>e.status==='error')).map(i=>`<div class="overview-row"><span class="tag ${traces[i].status==='failed'?'red':'amber'}">${traces[i].status==='failed'?'未完成':'已恢复'}</span><div><b>${traces[i].status==='failed'?'共享空间写入失败':'指标查询超时后重试成功'}</b><div class="muted" style="font-size:11px">第 ${sess().rounds.indexOf(i)+1} 轮 · ${traces[i].short}</div></div><button class="link" onclick="view='conversation';round=${i};resetRound();focusError()">定位步骤 →</button></div>`).join('')||'<p class="muted">没有需要关注的异常。</p>'}</div><div class="overview-card"><h2>逐轮执行</h2>${sess().rounds.map((i,n)=>`<div class="overview-row"><span class="muted">0${n+1}</span><div><b>${traces[i].short}</b><div class="muted" style="font-size:11px">${traces[i].events.length} 个步骤 · ${traces[i].token}K Token</div></div><div style="margin-left:auto">${badge(traces[i].status)}</div><span>${traces[i].duration}s</span><button class="link" onclick="view='conversation';setRound(${i});expanded=true;mode='waterfall';render()">查看耗时 →</button></div>`).join('')}</div></div>`}
function showList(){view='list';selectedEvent=null;app.innerHTML=`<div class="page-list"><div class="list-heading"><div><h1>会话</h1><p>查看对话内容，了解执行过程，定位问题</p></div><button onclick="listQuery='';listState='all';showList();notify('已刷新模拟会话')">⟳ 刷新</button></div><div class="statcards"><div class="statcard">演示会话<b>3</b>覆盖单聊、群聊与 WorkHub</div><div class="statcard">含失败调用的会话<b>3</b>需结合重试结果判断影响</div><div class="statcard">含未完成任务的会话<b style="color:#c57d6e">2</b>进入会话定位具体原因</div></div><div class="listcard"><div class="listbar"><div class="search">⌕ <input aria-label="搜索会话" placeholder="搜索会话标题、用户或 ID" value="${esc(listQuery)}" oninput="listQuery=this.value;renderListRows()"></div><select aria-label="筛选会话状态" onchange="listState=this.value;renderListRows()"><option value="all" ${listState==='all'?'selected':''}>全部执行状态</option><option value="failed" ${listState==='failed'?'selected':''}>含未完成任务</option><option value="done" ${listState==='done'?'selected':''}>已完成</option></select><span class="muted" style="font-size:11px;margin-left:auto">2026-10-28</span></div><div class="listtable-wrap"><table class="listtable"><thead><tr><th>会话</th><th>应用场景</th><th>用户 / 群 ID</th><th>轮数</th><th>执行情况</th><th>最近更新</th><th></th></tr></thead><tbody id="listrows"></tbody></table></div></div><div class="notice">点击第一条会话，可连续体验“超时恢复 → 权限不足 → 更换位置后成功”</div></div>`;renderListRows()}
function renderListRows(){const list=sessions.map((s,i)=>({s,i})).filter(({s})=>(!listQuery||[s.title,s.id,s.user].join(' ').toLowerCase().includes(listQuery.toLowerCase()))&&(listState==='all'||(listState==='failed'?s.rounds.includes(1):!s.rounds.includes(1))));$('#listrows').innerHTML=list.length?list.map(({s,i})=>`<tr><td><button class="link" style="font-size:12px" onclick="openSession(${i})">${s.title}</button><small>${s.id.slice(0,24)}…</small></td><td>${s.scene}</td><td>${s.user}</td><td>${s.rounds.length}</td><td><span class="tag ${s.status}">${s.state}</span></td><td>10:${37-i}:26</td><td><button class="link" onclick="openSession(${i})">查看 →</button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">未找到符合条件的会话</div></td></tr>'}
function modal(title,content){$('#overlay').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><button class="close" aria-label="关闭" onclick="closeModal()">×</button><h2>${title}</h2>${content}<div class="modalfoot"><button class="primary" onclick="closeModal()">知道了</button></div></div></div>`}
function closeModal(){$('#overlay').innerHTML=''}
function guide(){modal('让对话可读，让问题可定位',`<p>本版重点重新设计用户输入到 Agent 输出的阅读与诊断体验，保留 Studio 的 trace 分组和结构化事件详情。</p><div class="guide-grid"><div class="guide-tile"><b>① 对话优先</b><p>用户输入和最终回答默认可见，正常过程收起。多轮通过左侧导航切换。</p></div><div class="guide-tile"><b>② 逐层深入</b><p>摘要 → 执行步骤 → 原地摘要 / 右侧完整数据，按需要增加细节。</p></div><div class="guide-tile"><b>③ 区分事件与任务状态</b><p>第一轮工具报错后恢复；第二轮模型正常回答，但任务没有完成。</p></div><div class="guide-tile"><b>④ 保留上下文</b><p>右侧检查器无背景遮罩，支持上下条切换、重试关联和模型上下文查看。</p></div></div><h3>建议体验路径</h3><p>先读第一轮回答 → 点击「查看原因」 → 查看成功重试 → 展开「耗时分布」 → 选择最后一步模型调用并查看「模型上下文」 → 切换第二轮看权限失败。</p><p class="muted" style="font-size:11px">所有数据均为模拟。这是新的会话阅读与诊断方案，未连接后端；导出功能继续以此前单独原型为准，本次不改动原导出 PRD。</p>`) }
function showReport(){modal('10月27日游戏营销活动复盘',`<div class="message answer" style="padding:0;border:0">${traces[0].answer}</div><p class="muted" style="font-size:11px">这是模拟文档预览，没有创建真实在线文档。</p>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#overlay').innerHTML)closeModal();else if(selectedEvent!==null)closeInspector()}});
openSession(0);
</script></body></html>
