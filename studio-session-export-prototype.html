function traceDuration(ms){return Number.isFinite(ms)?`${Math.round(ms)/1000}s`:'尚未完成'}
function turns(d){return Array.from({length:d.count},(_,i)=>({durationMs:[6700,68000,3700][i%3],query:i===0?'帮我创建一个多维表格':i===1?'用于需求和缺陷跟踪，放到我的云空间根目录':`请补充第 ${i+1} 项需求的负责人和优先级`,user:d.scene==='POPO群聊'?`member${i%3+1}@example.com`:d.user,time:`2026-10-27 17:${String(3+i*2).padStart(2,'0')}:23`,events:i%2===0?['[模型调用] 思考：确认用户的表格需求与存储位置。','[工具调用] read_file\n输入：/skills/popo-doc/SKILL.md\n结果：已读取表格创建说明','[工具调用] create_table\n输入：需求跟踪表\n结果：创建成功']:['[工具调用] update_table\n输入：负责人、优先级\n结果：字段更新成功'],answer:i===0?'已创建「需求跟踪表」，包含需求名称、负责人、优先级和状态字段。':i===1?'已设置为需求与缺陷跟踪，并保存到你的云空间根目录。':'已补充负责人和优先级，请查收更新后的表格。'}))}
function detail(id){current=id;const d=data.find(d=>d.id===id);main.innerHTML=`<span class="back" onclick="showList()">← 返回会话列表</span><div class="heading"><div><h1>${d.agent}</h1><span class="subtitle">${d.scene} · ${d.user}</span></div>${topActions(true)}</div><div class="meta"><span>会话 ID　${id}</span><span>总 Token　${d.token}</span><span>${d.count} 条用户 Query</span></div>${turns(d).map((t,i)=>`<div class="turn"><div class="turnhead"><span>开始 ${t.time}</span><span>耗时 ${traceDuration(t.durationMs)}</span><span>模型 DeepSeek Flash</span><code>第 ${i+1} 轮对话</code></div><div class="event"><span class="tag user">用户 · ${t.user}</span>${t.query}<time>0:00:00</time></div>${t.events.map((e,j)=>`<div class="event"><span class="tag">${eventType(e)}</span><code>${esc(e.split('\n')[0].replace(/^\[.*?\] /,''))}</code><time>0:00:0${j+1}</time></div>`).join('')}<div class="event"><span class="tag answer">Agent 输出</span>${t.answer}<time>${traceDuration(t.durationMs)}</time></div></div>`).join('')}`}
function closeLayer(){drawerOpen=false;layer.innerHTML=''}
function modal(title,sub,body,foot){layer.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeLayer()"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modalhead"><div><h2>${title}</h2><span class="dim">${sub}</span></div><button class="close" aria-label="关闭" onclick="closeLayer()">×</button></div><div class="modalbody">${body}</div><div class="modalfoot">${foot}</div></section></div>`}
function openExport(id=null){drawerOpen=false;keep=false;exportIds=id?[id]:selected.size?[...selected]:visible().map(d=>d.id);scope=id?'single':selected.size?'selected':'filtered';renderExport()}
function chosen(){return exportIds}
function renderExport(){const single=scope==='single',n=chosen().length;modal(single?'导出会话':'批量导出会话','',`<div class="label">导出内容</div><label class="togglebox"><input type="checkbox" ${keep?'checked':''} onchange="keep=this.checked"><div><b>保留对话过程事件</b><small>包含已记录的思考、模型调用、工具调用与系统事件。</small></div></label>`,`<button onclick="closeLayer()">取消</button><button class="primary" ${!n?'disabled':''} onclick="submitExport()">创建导出任务</button>`);layer.querySelector('.modal').classList.add('export-modal')}
function submitExport(){const list=[...chosen()];if(!list.length)return;tasks.unshift({id:crypto.randomUUID(),ids:list,keep,name:`会话${list.length>1?'批量':''}导出_${new Date().toLocaleDateString('sv-SE').replaceAll('-','')}_${String(tasks.length+1).padStart(3,'0')}`,created:Date.now(),status:'queued',progress:0});persist();closeLayer();if($('#taskBadge'))$('#taskBadge').textContent=tasks.length;toast('✓ 导出任务已创建，可继续浏览　<button class="link" onclick="openTasks()">查看进度 →</button>')}
function openTasks(tab=taskTab){taskTab=tab;drawerOpen=true;drawTasks()}
function drawTasks(){const list=tasks.filter(t=>taskTab==='all'||(taskTab==='active'?['queued','running'].includes(t.status):t.status===taskTab));layer.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeLayer()"><section class="drawer" role="dialog" aria-modal="true" aria-label="导出任务"><div class="modalhead"><div><h2>导出任务 <span class="badge">${tasks.length}</span></h2><span class="dim">仅展示你创建的任务 · 文件保留 7 天</span></div><button class="close" aria-label="关闭" onclick="closeLayer()">×</button></div><div class="tabs">${[['all','全部'],['active','进行中'],['done','已完成'],['failed','失败']].map(([v,s])=>`<button class="${taskTab===v?'on':''}" onclick="openTasks('${v}')">${s}</button>`).join('')}</div><div class="drawerbody">${list.length?list.map(taskCard).join(''):'<div class="empty">暂无任务<br><br>创建的导出任务会显示在这里</div>'}</div><div class="modalfoot"><span class="dim">ⓘ 关闭面板不会中断导出任务</span></div></section></div>`}
function taskCard(t){const status={queued:'排队中',running:'生成中',done:'已完成',failed:'导出失败',expired:'已过期'};return `<article class="task"><div class="tasktop"><span>▧　${t.name}</span><span class="status ${t.status}">${status[t.status]}</span></div><div class="taskmeta">${t.ids.length} 个会话 · ${t.keep?'保留过程事件':'不含过程事件'} · Excel (.xlsx)<br>创建于 ${new Date(t.created).toLocaleString('zh-CN',{hour12:false})}</div>${['queued','running'].includes(t.status)?`<div class="progress"><i style="width:${t.progress}%"></i></div>`:''}<div class="taskbottom"><span>${t.status==='done'?'文件已就绪 · '+Math.max(0,7-Math.floor((Date.now()-t.created)/86400000))+' 天后过期':t.status==='failed'?'生成文件时连接中断，请重试':t.status==='expired'?'文件已过期，可重新创建任务':t.status==='queued'?'正在等待处理…':`正在整理对话与事件 ${t.progress}%`}</span>${t.status==='done'?`<button class="link" onclick="downloadTask('${t.id}')">↧ 下载文件</button>`:t.status==='failed'||t.status==='expired'?`<button class="link" onclick="retry('${t.id}')">${t.status==='failed'?'重新导出':'重新创建'}</button>`:''}</div></article>`}
function retry(id){const t=tasks.find(t=>t.id===id);tasks.unshift({...t,id:crypto.randomUUID(),created:Date.now(),status:'queued',progress:0,name:t.name.replace('_示例','')+'_重试'});persist();taskTab='all';drawTasks();toast('✓ 已重新创建导出任务')}
setInterval(()=>{let changed=false;for(const t of tasks){if(t.status==='done'&&Date.now()-t.created>7*86400000){t.status='expired';changed=true}if(['queued','running'].includes(t.status)){const seconds=(Date.now()-t.created)/1000;t.progress=Math.min(100,Math.floor(Math.max(0,seconds-2)*12));t.status=seconds<2?'queued':t.progress<100?'running':'done';changed=true;if(t.status==='done')toast(`✓ ${t.name} 已完成　<button class="link" onclick="openTasks()">前往下载 →</button>`)}}if(changed){persist();if(drawerOpen)drawTasks()}},1000);
function help(){modal('原型说明与导出规则','Studio 会话管理 · 导出功能设计',`<div class="notes"><div class="rule">建议体验：单行导出 → 切换过程事件 → 创建任务 → 查看进度 → 下载 Excel；也可勾选多个会话体验批量导出。</div><h3>会话与行的归属</h3><p>列表单行导出该会话的完整对话，详情页不提供导出按钮。批量导出自动使用列表范围：有勾选时导出已勾选会话（包含跨页选择），无勾选时导出全部筛选结果；弹窗不再选择范围。修改筛选时清空已选，避免范围混淆。任务提交时固定会话范围和数据快照。</p><h3>Excel 数据结构</h3><p>首列为会话 ID，随后为智能体、应用场景、Query 时间、耗时、用户、用户 Query、可选的过程事件列及 Agent 输出。智能体填写该会话的智能体名称；应用场景为 POPO单聊、POPO群聊、WorkHub、SDK 之一，按会话实际场景填写；耗时取每轮 trace 从用户输入到 Agent 最终回答完成的总时长，以秒（s）展示，与详情页一致，不累加单个工具或模型调用的耗时。尚未完成的回合标记为“尚未完成”。智能体、应用场景和耗时在不保留过程事件时仍导出。每条 Query 独占一行；群聊保留发起人的邮箱。首行为字段名，数据从第 2 行开始。按会话 ID 分组，组内按 Query 时间升序排列。</p><p>事件列表头使用实际类型名称：用户输入、模型调用、工具调用、MCP、Skills、上下文压缩、系统信息、Agent、报错信息；仅展开本次导出实际出现的类型，同类事件重复时添加序号。不同对话按事件类型对齐，必要时增加同类型列，保证每行事件的时间顺序，一个事件一个单元格。工具调用的输入、返回和状态放在同一事件单元格；空缺事件留空。真实产品应完整导出已记录事件，运行中无最终输出的回合标注“尚未完成”；不生成额外思考内容。超出 Excel 单元格或行列限制时，应分片并附索引，禁止静默截断。</p><h3>异步生命周期</h3><p>排队中 → 生成中 → 已完成；失败可重试，7 天后过期可重新创建。导出任务与原页面解耦，仅显示本人任务。服务端生成和下载时校验会话权限。</p><h3>本原型的边界</h3><p>使用 12 条模拟会话；异步进度在浏览器内演示，任务保存在本机，重新打开后恢复。支持下载真实 .xlsx 示例文件。已完成、失败和过期任务预置用于评审；尚未连接 Studio 后端。导航中其他模块仅保留视觉框架。</p><p>附件 Excel 实际字段为“时间、用户、接口、类型、日期”，本方案依据本次明确需求定义新的导出结构。“第一个单元格”按首列为会话 ID 处理，以支持标准表头及批量筛选。</p></div>`,`<button class="primary" onclick="closeLayer()">开始体验</button>`)}
// Minimal OOXML writer: UTF-8 inline strings and an uncompressed ZIP, no external runtime.
function xlsx(rows){const xml=s=>String(s).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));const col=i=>{let s='';for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s};const files={'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>','_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="会话对话" sheetId="1" r:id="rId1"/></sheets></workbook>','xl/_rels/workbook.xml.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>','xl/styles.xml':'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2678ED"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf fontId="1" fillId="2" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs></styleSheet>','xl/worksheets/sheet1.xml':`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane xSplit="1" ySplit="1" topLeftCell="B2" activePane="bottomRight" state="frozen"/></sheetView></sheetViews><cols>${rows[0].map((_,i)=>`<col min="${i+1}" max="${i+1}" width="${i===0?40:i===1?24:i===2?18:i===3?23:i===4?14:i===5?30:48}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((row,i)=>`<row r="${i+1}" ht="${i?95:28}" customHeight="1">${row.map((v,j)=>`<c r="${col(j)}${i+1}" t="inlineStr" s="${i?0:1}"><is><t xml:space="preserve">${xml(v)}</t></is></c>`).join('')}</row>`).join('')}</sheetData><autoFilter ref="A1:${col(rows[0].length-1)}${rows.length}"/></worksheet>`};return zip(files)}
function zip(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;const crc=b=>{let c=0xffffffff;for(let x of b){c^=x;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0};const buf=(n)=>new Uint8Array(n);for(const[name,text]of Object.entries(files)){const n=enc.encode(name),b=enc.encode(text),c=crc(b),h=buf(30),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,c,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);chunks.push(h,n,b);const z=buf(46),w=new DataView(z.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint32(16,c,true);w.setUint32(20,b.length,true);w.setUint32(24,b.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);central.push(z,n);offset+=30+n.length+b.length}const end=buf(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,Object.keys(files).length,true);v.setUint16(10,Object.keys(files).length,true);v.setUint32(12,central.reduce((a,b)=>a+b.length,0),true);v.setUint32(16,offset,true);return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const eventTypes=['用户输入','模型调用','工具调用','MCP','Skills','上下文压缩','系统信息','Agent','报错信息'];
function eventType(event){const type=event.match(/^\[([^\]]+)\]/)?.[1];if(!eventTypes.includes(type))throw new Error('未知事件类型：'+type);return type}
function eventColumns(rows){
  const types=[];
  // Merge ordered event types so every row preserves chronological order.
  for(const row of rows){let cursor=0;for(const event of row.events){const type=eventType(event);const at=types.indexOf(type,cursor);if(at<0){types.splice(cursor,0,type);cursor++}else cursor=at+1}}
  const totals={},seen={};types.forEach(type=>totals[type]=(totals[type]||0)+1);
  return {types,headers:types.map(type=>{seen[type]=(seen[type]||0)+1;return totals[type]>1?`${type} ${seen[type]}`:type})};
}
function taskRows(t){
  const rows=t.ids.slice().sort().flatMap(id=>{const d=data.find(d=>d.id===id);return d?turns(d).map(turn=>({id,agent:d.agent,scene:d.scene,...turn})):[]});
  const columns=t.keep?eventColumns(rows):{types:[],headers:[]};
  return [['会话 ID','智能体','应用场景','Query 时间','耗时','用户','用户 Query',...columns.headers,'Agent 输出'],...rows.map(r=>{const cells=Array(columns.types.length).fill('');let cursor=0;if(t.keep)for(const event of r.events){const at=columns.types.indexOf(eventType(event),cursor);cells[at]=event;cursor=at+1}return [r.id,r.agent,r.scene,r.time,traceDuration(r.durationMs),r.user,r.query,...cells,r.answer]})];
}
function downloadTask(id){const t=tasks.find(t=>t.id===id);if(!t||t.status!=='done')return;const url=URL.createObjectURL(xlsx(taskRows(t))),a=document.createElement('a');a.href=url;a.download=t.name+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('✓ Excel 文件已开始下载')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});showList();
</script></body></html>
